name: compile test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: sysinfo
      run: echo -en '\e[33;1mThread count:\e[0m ' && nproc && free -h
    - name: build-deps
      run: sudo apt install equivs && make build-deps-package && sudo apt install ./bin/packages/duris-build-deps_1.0_all.deb
    - name: build and test
      run: make test-all -j"$(nproc)" TEST_JOBS="$(nproc)"
