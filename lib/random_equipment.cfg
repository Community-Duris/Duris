# Random equipment generation settings.
#
# This file is read by the random-equipment subsystem during server startup;
# restart the server after changes. Values affect newly generated equipment,
# not items that already exist. Percentages are written as numbers such as
# 15.0 for fifteen percent.
#
# Hardcore-specific drop tuning is in lib/hardcore.cfg. The settings here are
# shared by ordinary and Hardcore generation unless a setting explicitly says
# otherwise.

# -----------------------------------------------------------------------------
# Drop chances
# -----------------------------------------------------------------------------
# drop.piece.percentage: final chance to generate a random equipment piece.
drop.piece.percentage=15.0

# drop.equipment.percentage: final chance that an eligible equipment drop is
# generated rather than skipped.
drop.equipment.percentage=8.0

# drop.luck.divisor: divides a character's luck contribution. A smaller divisor
# makes luck matter more; a larger divisor makes luck matter less.
drop.luck.divisor=4.0

# -----------------------------------------------------------------------------
# Drop eligibility and random adjustments
# -----------------------------------------------------------------------------
# drop.maximum.level.gap: maximum allowed difference between the source mob's
# level and the generated equipment level.
drop.maximum.level.gap=10

# drop.neutral.roll.max: random roll used for neutral drop adjustment. A value
# of N gives the neutral result a 1/(N+1) chance when the roll is zero.
drop.neutral.roll.max=9

# drop.base.chance: starting chance before level, luck, elite, and random
# adjustments are applied.
drop.base.chance=50

# drop.jitter.minimum / maximum: inclusive random adjustment added to the base
# chance. Set both to 0 to remove this random variation.
drop.jitter.minimum=-5
drop.jitter.maximum=5

# drop.low_level.threshold: mob level below which the low-level bonus applies.
drop.low_level.threshold=26

# drop.low_level.bonus.max: maximum random low-level bonus added to eligible
# drops. Set to 0 to remove this bonus.
drop.low_level.bonus.max=10

# drop.elite.bonus.minimum / maximum: random bonus range for elite drops.
drop.elite.bonus.minimum=5
drop.elite.bonus.maximum=15

# -----------------------------------------------------------------------------
# Material quality
# -----------------------------------------------------------------------------
# quality.level.multiplier: multiplier applied to the average killer/mob level
# when selecting material quality. 1.0 preserves the current behavior; larger
# values favor higher quality, smaller values favor lower quality.
quality.level.multiplier=1.0

# -----------------------------------------------------------------------------
# Maximum generated affect values by mob level
# -----------------------------------------------------------------------------
# The level boundaries use strict greater-than comparisons. For example, a mob
# above level 35 enters the medium cap band, and a mob above level 49 enters the
# high cap band.
stat.cap.medium.level=35
stat.cap.high.level=49
stat.cap.elite.level=60

# Maximum value for the primary affect in each level band.
stat.cap.low=4
stat.cap.medium=5
stat.cap.high=6
stat.cap.elite=8

# -----------------------------------------------------------------------------
# Additional affects
# -----------------------------------------------------------------------------
# Secondary affects become possible at or above this level. A roll max of N
# gives a 1/(N+1) chance for the secondary affect roll to succeed.
stat.secondary.minimum.level=20
stat.secondary.roll.max=2

# Tertiary affects become possible at or above this level.
stat.tertiary.minimum.level=49
stat.tertiary.roll.max=5

# -----------------------------------------------------------------------------
# Affect strength and item weight
# -----------------------------------------------------------------------------
# These divisors control how strongly level and random rolls affect generated
# stats. Smaller divisors generally produce stronger affects.
stat.primary.divisor=46
stat.secondary.divisor=36
stat.tertiary.divisor=30
stat.random.bonus.max=20

# Generated weight uses: (raw weight + base weight * multiplier) / divisor.
# Increasing the multiplier raises generated weight; increasing the divisor
# lowers it.
weight.base.multiplier=2.0
weight.divisor=3.0
