# Frag-cap balance configuration.
#
# This file is read once during boot by the frag-cap subsystem. Restart the
# server after changing it. If the file is missing or a value is invalid, the
# compiled legacy default is retained for that value.
#
# The level_cap database row is live state: current highest frags, leading
# racewar, current cap level, and next_update. This file controls policy when
# that state is read, advanced, or reset; changing it does not reset the row.

# Cap policy.
# floor.level is a lower safety clamp and database-read failure fallback.
# frag.base.level is the level represented by zero frags and the base of the
# frag-to-level conversion. It is separate from the safety floor.
# reset.level is written during a pwipe/reset (legacy behavior: 31).
# maximum.level is the upper cap clamp (legacy mortal maximum: 56).
# level.step is added after a timed, frag-qualified cap increase.
# frags.per.level is the number of highest-fragger frags needed per level.
cap.floor.level=25
cap.frag.base.level=25
cap.reset.level=31
cap.maximum.level=56
cap.level.step=1
cap.frags.per.level=0.429

# Timer policy, in whole days.
# default.days applies to ordinary level transitions. The explicit circle-level
# entries apply when the old cap is exactly that level: 35->36, 40->41,
# 45->46, and 50->51. These milestones are separate from level.step, so the
# policy remains clear when level.step changes from 5 to 1 or another value.
timer.default.days=5
timer.circle.level.35.days=7
timer.circle.level.40.days=7
timer.circle.level.45.days=7
timer.circle.level.50.days=7

# Reward granted to the racewar side that causes a cap increase.
# duration.minutes is the boon duration; bonus=2 preserves the existing 100%
# experience multiplier representation. Set either to 0 to disable that part
# of the reward without changing cap advancement.
boon.duration.minutes=2880
boon.bonus=2
