# Frag-cap balance configuration.
#
# This file is read once during boot by the frag-cap subsystem. Restart the
# server after changing it. If the file is missing or a value is invalid, the
# compiled legacy default is retained for that value.
#
# The level_cap database row still stores live state: current highest frags,
# leading racewar, current cap level, and next_update. This file controls the
# policy used when that state is read, advanced, or reset; it does not reset
# the database row merely because the file changed.

# Normal cap range and advancement policy.
# minimum.level is the lower clamp and the database-read failure fallback.
# reset.level is the level written by a pwipe/reset (legacy behavior: 31).
# maximum.level is the upper cap clamp (legacy mortal maximum: 56).
# level.step is added when a timed, frag-qualified cap increase occurs.
# frags.per.level is the number of highest-fragger frags needed per level.
cap.minimum.level=25
cap.reset.level=31
cap.maximum.level=56
cap.level.step=5
cap.frags.per.level=0.429

# Timer policy, in whole days.
# first.days is used by a pwipe/reset and when the previous cap is at the
# configured minimum. The remaining bands select the delay from old_level
# when a frag-qualified cap increase occurs. All defaults are 7 to preserve
# the current runtime, while the bands retain the historical level ranges.
timer.first.days=7
timer.level.26_29.days=7
timer.level.30_39.days=7
timer.level.40_49.days=7
timer.level.50_56.days=7

# Reward granted to the racewar side that causes a cap increase.
# duration.minutes is the boon duration; bonus=2 preserves the existing 100%
# experience multiplier representation. Set either to 0 to disable that part
# of the reward without changing cap advancement.
boon.duration.minutes=2880
boon.bonus=2
