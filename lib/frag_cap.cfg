# Frag-cap and racewar progression settings.
#
# This file is read once during server boot. Restart the server after making
# changes. If the file is missing or a value is invalid, the compiled legacy
# default is retained for that value.
#
# The level_cap database row is live state: current highest frags, leading
# racewar, current cap level, and next_update. This file controls what the
# server does with that state when it is read, advanced, or reset. Changing
# this file does not reset the database row.
#
# In plain terms: change the cap settings to control how many frags are needed
# to raise the level cap; change timer settings to control how long a qualified
# cap increase must wait; change boon settings to control the reward for the
# racewar side that causes the increase.

# -----------------------------------------------------------------------------
# Cap and frag-to-level conversion
# -----------------------------------------------------------------------------
# cap.floor.level: lowest cap level the server will accept. It is also the
# fallback used if the cap level cannot be read from the database.
cap.floor.level=25

# cap.frag.base.level: level represented by zero frags in the conversion from
# highest-fragger frags to a cap level. This is separate from the safety floor.
# Raising it means the same number of frags produces a lower calculated level.
cap.frag.base.level=25

# cap.reset.level: cap level written during a pwipe/reset. This does not change
# the live cap until a reset operation writes the new value.
cap.reset.level=31

# cap.maximum.level: absolute upper cap for both regular and Hardcore players.
# Keep this at or below 56 unless the shared game maximum is intentionally
# changed elsewhere. Hardcore cannot exceed this value.
cap.maximum.level=56

# cap.level.step: number of cap levels added by one successful, timed cap
# increase. 1 means each qualified update raises the cap by one level.
cap.level.step=1

# cap.frags.per.level: highest-fragger frags required for each calculated level.
# Larger values make cap increases require more frags; smaller values make them
# require fewer. This value is a decimal because frags are stored in the legacy
# scaled representation.
cap.frags.per.level=0.429

# -----------------------------------------------------------------------------
# Waiting periods before cap increases
# -----------------------------------------------------------------------------
# All timer values are whole days. A value of 0 removes the waiting period for
# that transition. timer.default.days applies unless a more specific rule
# below matches the current cap level. The server rechecks this condition
# periodically, so once the required frag threshold has already been reached,
# the cap increase and boon are awarded when the timer expires even if no new
# frag is recorded afterward.
timer.default.days=5

# Special timers when the old cap is exactly this level. These control the
# transitions 35->36, 40->41, and 45->46.
timer.circle.level.35.days=7
timer.circle.level.40.days=7
timer.circle.level.45.days=7

# Specific timers for high-level transitions. These control 50->51 through
# 55->56. There is intentionally no level-56 entry: 56 is the shared player
# maximum, so 56->57 cannot occur.
timer.level.50.days=7
timer.level.51.days=7
timer.level.52.days=7
timer.level.53.days=7
timer.level.54.days=7
timer.level.55.days=7

# -----------------------------------------------------------------------------
# Hardcore cap lead
# -----------------------------------------------------------------------------
# Hardcore characters may use a cap this many levels above the normal cap for
# experience-cap purposes. Example: normal cap 54 plus 2 gives Hardcore an
# effective cap of 56. The result is always clamped to cap.maximum.level.
# This is the ONLY configuration key for the Hardcore frag-cap allowance.
hardcore.levels.beyond.cap=2

# -----------------------------------------------------------------------------
# Reward for a successful cap increase
# -----------------------------------------------------------------------------
# boon.duration.minutes: how long the racewar-side experience boon lasts.
# 0 disables the duration-based boon without stopping cap advancement.
boon.duration.minutes=2880

# boon.bonus: bonus value used by the existing boon system. 2 preserves the
# current 100% experience-multiplier representation. 0 disables the bonus
# portion of the reward without stopping cap advancement.
boon.bonus=2
