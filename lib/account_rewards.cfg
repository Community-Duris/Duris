# Account-bound divine reward policy.
#
# This file is read once when the MUD boots. Restart the MUD after changing it.
# Invalid or missing values retain the documented safe defaults.

# summon.cooldown.seconds: minimum real-world time before one character can
# recreate a missing copy of the same account reward. The timer is stored per
# character and reward, so reconnecting does not bypass it. A reward already
# carried or worn is never duplicated. 3600 = one hour. 0 disables the delay.
# Valid range: 0-604800 seconds (seven days).
summon.cooldown.seconds=3600

# player.max.active.rewards: maximum number of different divine reward copies
# one character may carry or wear at the same time. 0 means unlimited and is the
# compatibility default. Set 1 for a single active event reward, 2 or 3 for
# small loadouts, or another value through 100. Lowering this value never
# confiscates existing rewards; it only blocks new summons until the character
# dismisses enough active rewards. Restart required after changing this file.
# Valid range: 0-100 rewards.
player.max.active.rewards=0

# player.show.claim.ids: when true, player reward lists include the stable claim
# ID as reference information. Players still select rewards by the simple list
# number shown at the left. Set false to hide internal identifiers.
player.show.claim.ids=true

# pwipe.preserve: controls account reward grants when a successful player wipe
# completes. true keeps permanent and unexpired day-based grants, decrements
# finite pwipe grants by one, and removes a finite grant when it reaches zero.
# false removes every account reward grant. This does not preserve ordinary
# player inventory; eligible rewards are recreated from their grant templates.
# Successful pwipe processing records one global timestamp. Any repeated call
# within 28 days is treated as an already-processed retry and changes nothing.
pwipe.preserve=true
