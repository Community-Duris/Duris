# =============================================================================
#  ENHANCE AFFECT CONFIG — opt-in allow list
#  Only affects explicitly marked ALLOWED (1) can appear on enhanced items.
#  New affects added to the codebase are BLOCKED (0) by default and must be
#  opted in here.
#
#  HOW IT WORKS
#  ────────────
#  At boot, the MUD reads this file and builds five bitmasks (one per
#  bitvector field).  Every flag marked '1' has its bit set in the mask.
#  Then, every time a player tries to enhance an item, the code checks:
#
#      if( item->bitvector & ~allowed_mask ) → BLOCKED
#
#  That means: if the item has ANY bit set that is NOT in the allowed mask,
#  the enhancement is rejected.  The ival cap (95) is a separate check and
#  still applies — this config is additive.
#
#  EDITING THIS FILE
#  ─────────────────
#  To ALLOW an affect:   change its '0' to '1' (or add a new line)
#  To BLOCK an affect:   change its '1' to '0' (or remove the line)
#  To add a new affect:  add a line here AND add its name & bit value to
#                        the enhance_flag_map[] table in drannak.c
#
#  After editing, restart the MUD or use the 'properties reload' command
#  (if wired up) — the config is loaded once at boot.
#
#  SECTION KEYS
#  ────────────
#  [bitvector]   = bitvector   field (AFF_ flags)
#  [bitvector2]  = bitvector2  field (AFF2_ flags)
#  [bitvector3]  = bitvector3  field (AFF3_ flags)
#  [bitvector4]  = bitvector4  field (AFF4_ flags)
#  [bitvector5]  = bitvector5  field (AFF5_ flags)
#  [spell]       = spell-based item affects (checked via get_spell_from_obj)
#
#  FORMAT
#  ──────
#  <FLAG_NAME> = <ival_contribution>, <0|1>
#    0 = BLOCKED (not allowed for enhance)
#    1 = ALLOWED (can be enhanced)
#    ival_contribution = how much this flag adds to the item's total value
#                        in the itemvalue() formula (reference only, not used
#                        by this config — the ival cap is separate)
#    (char state)      = this is a temporary spell effect on a character,
#                        not a permanent item affect — marking it BLOCKED
#                        is a precaution; it shouldn't appear on items
#
#  Lines starting with '#' are comments and are ignored.
#  Lines starting with '#  ' that have a flag name are informational
#  references — they show flags that are not currently in the allow list.
# =============================================================================

[settings]
# ─────────────────────────────────────────────────────────────────────────────
#  ENHANCE ALGORITHM SETTINGS — current hardcoded values
#  These control how the enhance system behaves.  Changing them requires
#  updating the C code to read from this config (they're currently compiled
#  constants in drannak.c).
# ─────────────────────────────────────────────────────────────────────────────

# Maximum item value (ival) that can be enhanced.
# Items with ival > this are "too powerful to be enhanced further."
#   Current: 95  (source->ival ≤ 95, result caps at 99)
enhance.ival.cap=95

# Minimum material item value: source_ival − this.
# The material must have at least this ival to be used.
#   Current: 5
enhance.material.ival.delta=5

# Bonus material ival delta for guild insignia items.
# Source items with ITEM_GUILD_INSIGNIA need material_ival ≥ source_ival − delta + bonus.
#   Current: 5
enhance.guild.insignia.ival.bonus=5

# ── Cost (platinum) ──────────────────────────────────────────────────────────

# Cost for low-value items (source_ival ≤ this threshold).
#   Current: 20  (threshold), 1000 (cost)
enhance.cost.low.ival.threshold=20
enhance.cost.low.amount=1000

# Cost for high-value items (source_ival > threshold).
#   Current: 10000
enhance.cost.high.amount=10000

# ── Level gate ───────────────────────────────────────────────────────────────

# Player level requirement formula: source_ival ≤ (level² / A + level / B + C)
#   Current: A=41, B=3, C=1
enhance.level.gate.a=41
enhance.level.gate.b=3
enhance.level.gate.c=1

# ── Luck / ival gain ─────────────────────────────────────────────────────────

# Luck checks: if number(1, range) < player_luck, the bonus tier activates.
# Multiple tiers stack downward — only the highest that passes fires.
#   Current: extreme=1200, very=800, lucky=400
enhance.luck.extreme.range=1200
enhance.luck.very.range=800
enhance.luck.lucky.range=400

# Ival increase per luck tier (source_ival + this).
#   Current: extreme=4, very=3, lucky=2, normal=1
enhance.ival.gain.extreme=4
enhance.ival.gain.very=3
enhance.ival.gain.lucky=2
enhance.ival.gain.normal=1

# ── Vnum search ──────────────────────────────────────────────────────────────

# Random item search range — the code picks vnums at random in this range.
#   Current: 1300 to 134000
enhance.search.vnum.min=1300
enhance.search.vnum.max=134000

# Maximum search attempts before giving up ("item gods could not find...").
# Multiplied by luck tier (extreme ×4, very ×3, lucky ×2).
#   Current: 20000
enhance.search.max.attempts=20000

# ── Wear flags ───────────────────────────────────────────────────────────────

# Wear flags to skip when matching source to result (too common, override
# what people really want).  Bitmask value — combine with |.
#   Current: ITEM_TAKE(1) | ITEM_HOLD(2) | ITEM_ATTACH_BELT(4) | ITEM_WEAR_BACK(8) = 15
enhance.wear.skip.mask=15

# ── Original (ival-based) enhance ────────────────────────────────────────────

# Maximum ival gain above the source item's ival (the luck roll ceiling).
#   Current: 4 (extreme luck gives +4)
enhance.original.max.roll=4

# When the exact rolled ival has no matching template, the system slides
# downward first (lower gain), then upward (higher gain than rolled).
#   Current: 1 (downward first, then upward)
enhance.original.cascade.down.first=1

# =============================================================================

[enhance_stat]
# ─────────────────────────────────────────────────────────────────────────────
#  STAT-ENHANCE SETTINGS (enhance <source> <stat> <donor>)
#  This path bumps a specific stat on the source item rather than replacing
#  it with a random template.  The donor must have the stat or a higher ival.
#  The system finds the next-tier template, and the player must provide
#  the raw materials that template is made of as tribute.
# ─────────────────────────────────────────────────────────────────────────────

# Maximum multiplier of the stat's original value.
# A 1dam bracer can reach at most 2dam (2× original).
enhance_stat.cap.multiplier=2.0

# Whether a donor with a stat exceeding the template's value grants
# superior quality to the item.
enhance_stat.superior.enabled=1

# Craftsmanship bonus applied when superior status is granted.
enhance_stat.superior.craftsmanship.bonus=1

# ── Platinum cost ────────────────────────────────────────────────────────────

# Base platinum cost per stat-enhance attempt.
enhance_stat.platinum.base=1000

# Additional platinum per point of the source item's ival.
enhance_stat.platinum.per.ival=100

# ── Material tribute ─────────────────────────────────────────────────────────

# The template item's material type determines what raw materials are
# demanded.  This multiplier scales the quantity.
enhance_stat.material.quantity.mult=1.0

# =============================================================================

