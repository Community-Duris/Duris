# =============================================================================
# CRAFTING CONFIGURATION
# =============================================================================
# Owner: src/crafting.c. Loaded once during normal game boot after object
# templates are available. This file is NOT live-reloadable; restart after a
# change. Unknown keys are ignored. Numeric settings apply only when their
# documented validation passes; malformed values should be treated as operator
# errors and avoided rather than relied upon for fallback behavior.
#
# This controls modern `craft` and modern recipe-based `forge` together. It
# does not control old smith-NPC catalog recipes in forge_items.c, mining,
# material drop rates, object-template stats, or which recipes a player knows.
# Recipe ownership is moving to SQL player_recipes; legacy recipe files are a
# compatibility concern, not a balance setting.
#
# Defaults preserve historical behavior. Comments describe behavior from an
# operator perspective; do not add object vnum ranges or engine limits here.

[settings]
# Maximum recipe item value a player may make is:
#   player level * crafting.level.gate.multiplier
# Both Craft and Forge apply the same gate. Must be a positive integer.
# Historical default: 3.
crafting.level.gate.multiplier=3

# Experience awarded after a successful Craft or Forge is:
#   recipe item value * crafting.experience.per.ival
# Set to 0 to retain items/material behavior while awarding no crafting XP.
# Must be a non-negative integer. Historical default: 1000.
crafting.experience.per.ival=1000

# Multiplies each positive material requirement after the normal recipe plan is
# calculated. Nonzero results round UP so lowering this does not create a free
# required ingredient. Must be greater than zero.
# Historical default: 1.0 (no change).
crafting.material.quantity.multiplier=1.0

# Opt-in/rollback gates for the modern commands. `0` leaves legacy smith-NPC
# forging untouched; it disables only `craft` or the recipe-based `forge`.
crafting.craft.enabled=1
crafting.forge.enabled=1

# Existing support-item vnums. Positive values only are accepted. These are
# content references, not engine storage invariants. Craft and Forge may use
# distinct vnums even when current content maps their essences together.
crafting.craft.essence.vnum=400211
crafting.craft.tool.vnum=400224
crafting.forge.essence.vnum=400211
crafting.forge.tool.vnum=400223
