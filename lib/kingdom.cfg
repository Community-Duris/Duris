# kingdom.cfg -- the kingdom code (guild territory on the overhead map)
#
# Read once at boot by kingdom_config_load(). Anything omitted keeps the
# compiled default, which is OFF: if this file is missing entirely the
# subsystem stays off and logs that it did -- a designed outcome, not an error.
#
# THIS SERVER SHIPS THE FEATURE ON (kingdom.enabled = 1 below). Set it to 0 to
# switch the whole subsystem off: kingdom commands then refuse politely, no
# upkeep is charged, no harvest nodes load, and -- this is the important one --
# guildhall placement behaves exactly as it did before the module existed.
#
# LEAVING IT ON MAKES HALL PLACEMENT STRICTER. A main hall becomes a realm's
# seat, so the whole 9x9 block a realm would eventually need must be legal
# ground at the moment the hall is built, and two realms may not adjoin. Sites
# that were acceptable before the module existed can therefore be refused.

# ---------------------------------------------------------------------------
# Master switch
# ---------------------------------------------------------------------------
kingdom.enabled = 1

# ---------------------------------------------------------------------------
# What land costs
# ---------------------------------------------------------------------------
# Coin price of claim number N, in COPPER, is:
#
#     base * (growth/1000) ^ (N-1)
#
# COMPOUNDING, so the curve steepens as a realm grows. The ratios are the
# engine's own: 10 copper = 1 silver, 100 = 1 gold, 1000 = 1 platinum.
#
# The shipped pair is 1,000 platinum for the first square and +5% for each one
# after it. That puts the corners of the curve at:
#
#     square      price          running total
#          1      1,000 p              1,000 p
#          8      1,407 p              9,549 p   (ring 1 complete)
#         24      3,071 p             52,113 p   (ring 2 complete)
#         48      9,906 p            227,178 p   (ring 3 complete)
#         80     47,201 p            971,229 p   (the whole map)
#
# Ruled 2026-09-03: land is meant to be a project for a guild of ten or more,
# and the last ring is meant to be a different order of undertaking from the
# first. Growth is per MILLE (1050 = x1.05) so the price is integer arithmetic
# and two servers always agree on it. Values below 1000 are refused -- they
# would make land cheaper the more of it you held.
kingdom.claim.cost.base = 1000000
kingdom.claim.cost.growth.permille = 1050

# Land also costs WORKED MATERIAL, and all four kinds of it: mineral, wood,
# fibre and water, gathered from harvest nodes with `kingdom harvest` and
# banked in the realm's stores. This is the units of EACH resource the first
# square costs; the amount rides the same compounding curve as the coin, so
# square 1 wants 25 of each and square 80 wants about 1,180.
#
# A realm short of even one kind pays nothing and claims nothing -- the bill is
# all-or-nothing -- so expansion cannot run on one sort of ground. Set to 0 to
# make land cost coin alone.
kingdom.claim.material.base = 25

# ---------------------------------------------------------------------------
# What land costs to KEEP
# ---------------------------------------------------------------------------
# Charged per owned square, per cycle, in copper. A realm that cannot pay walks
# the arrears ladder: guards despawn, then harvest nodes go dormant, then one
# OUTER RING reverts per further missed cycle. Paying halts the ladder where it
# stands; a reverted ring must be re-claimed at full price.
kingdom.upkeep.per.square = 250

# Seconds between charges. The event registry counts pulses internally; the
# conversion is handled at registration, so this really is seconds.
#
# ONE REAL WEEK (604800). Ruled 2026-09-03: upkeep is a standing obligation on
# a guild, not a tax on being logged in, and the hour it started at meant a
# realm could walk the whole arrears ladder over a single night's absence. A
# week is also the ceiling this key accepts.
kingdom.upkeep.period.seconds = 604800

# ---------------------------------------------------------------------------
# Garrison
# ---------------------------------------------------------------------------
# One guard is permitted per this many owned squares, so a full 80-square realm
# supports 16 at the default of 5.
kingdom.guards.per.squares = 5

# What a guard costs to raise, and what the best one costs, in COPPER. Guards
# are bought one at a time with `kingdom guard hire` and upgraded with
# `kingdom guard upgrade`; the level a realm may reach is set by how many
# complete rings it holds -- ring 1 gives level 50, ring 2 level 52, ring 3
# level 54, and the whole 80 squares level 56.
#
# A newly raised guard costs the base (5,000 platinum shipped). An upgrade to
# the top tier costs the difference up to the cap (20,000 platinum shipped),
# and the tiers in between are spaced evenly across that span. Upgrades are
# one-way: a guard's level never falls.
kingdom.guard.cost.base = 5000000
kingdom.guard.cost.max = 20000000

# ---------------------------------------------------------------------------
# Where land may NOT be taken
# ---------------------------------------------------------------------------
# Both are measured in map squares, and both are checked against EVERY one of
# the 80 squares a realm would eventually hold -- not merely against the hall.
#
# These exist to stop a realm being used to fence off a town or to bottle up a
# zone entrance. Raising them makes viable sites rarer; the map is sparse
# enough that large values may leave very few legal locations.
# MEASURED, not guessed. These were 30 apiece, and at 30 there is NOWHERE on
# the surface map a realm can be founded -- not a scarce few sites, zero. The
# map carries 367 squares that cross into another zone, each excluding a 59x59
# box around itself, and together they blanket the continent. Surveying every
# one of the 160,000 surface squares against these rules gives:
#
#     distance   squares left   legal seats
#           30              0             0
#           20            161             0
#           15          1,509             6
#           12          4,793           141
#           10          9,587           500
#            8         17,703         1,393
#            5         34,908         5,037
#
# Ruled 2026-09-03 down to FIVE, which leaves about 5,000 seats. Ten was
# survivable -- 500 seats out of 160,000 squares -- but in play it still meant
# a long hunt across a continent for ground that would take a realm, with no
# way to tell a promising square from a barred one until the hall was already
# built. Five keeps realms off towns and out of zone mouths while leaving
# enough ground that `kingdom prospect` can find some from where you stand.
# Raise these and the count falls away very fast; the step from 5 to 10 costs
# 90% of the sites, and 10 to 15 costs 99% of what is left.
kingdom.min.hometown.distance = 5
kingdom.min.entrance.distance = 5
