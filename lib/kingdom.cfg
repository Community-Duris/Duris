# kingdom.cfg -- the kingdom code (guild territory on the overhead map)
#
# Read once at boot by kingdom_config_load(). Anything omitted keeps the
# compiled default, which is OFF: if this file is missing entirely the
# subsystem stays off and logs that it did -- a designed outcome, not an error.
#
# THIS SERVER SHIPS THE FEATURE ON (kingdom.enabled = 1 below). Set it to 0 to
# switch the whole subsystem off: kingdom commands then refuse politely, no
# upkeep is charged, no harvest nodes load, and -- this is the important one --
# guildhall placement behaves exactly as it did before the module existed.
#
# LEAVING IT ON MAKES HALL PLACEMENT STRICTER. A main hall becomes a realm's
# seat, so the whole 9x9 block a realm would eventually need must be legal
# ground at the moment the hall is built, and two realms may not adjoin. Sites
# that were acceptable before the module existed can therefore be refused.

# ---------------------------------------------------------------------------
# Master switch
# ---------------------------------------------------------------------------
kingdom.enabled = 1

# ---------------------------------------------------------------------------
# What land costs
# ---------------------------------------------------------------------------
# Price of claim number N, in COPPER, is:
#
#     base + per.square * N
#
# so the eightieth square costs a good deal more than the first. The ratios are
# the engine's own: 10 copper = 1 silver, 100 = 1 gold, 1000 = 1 platinum.
#
# With the defaults below, claim n costs 25,000 + 5,000n copper, so a full
# realm of 80 squares costs 18,200,000 copper in total -- about 18,200
# platinum -- with ring 4 alone accounting for well over half of it.
kingdom.claim.cost.base = 25000
kingdom.claim.cost.per.square = 5000

# ---------------------------------------------------------------------------
# What land costs to KEEP
# ---------------------------------------------------------------------------
# Charged per owned square, per cycle, in copper. A realm that cannot pay walks
# the arrears ladder: guards despawn, then harvest nodes go dormant, then one
# OUTER RING reverts per further missed cycle. Paying halts the ladder where it
# stands; a reverted ring must be re-claimed at full price.
kingdom.upkeep.per.square = 250

# Seconds between charges. The event registry counts pulses internally; the
# conversion is handled at registration, so this really is seconds.
kingdom.upkeep.period.seconds = 3600

# ---------------------------------------------------------------------------
# Garrison
# ---------------------------------------------------------------------------
# One guard is permitted per this many owned squares, so a full 80-square realm
# supports 16 at the default of 5.
kingdom.guards.per.squares = 5

# ---------------------------------------------------------------------------
# Where land may NOT be taken
# ---------------------------------------------------------------------------
# Both are measured in map squares, and both are checked against EVERY one of
# the 80 squares a realm would eventually hold -- not merely against the hall.
#
# These exist to stop a realm being used to fence off a town or to bottle up a
# zone entrance. Raising them makes viable sites rarer; the map is sparse
# enough that large values may leave very few legal locations.
# MEASURED, not guessed. These were 30 apiece, and at 30 there is NOWHERE on
# the surface map a realm can be founded -- not a scarce few sites, zero. The
# map carries 367 squares that cross into another zone, each excluding a 59x59
# box around itself, and together they blanket the continent. Surveying every
# one of the 160,000 surface squares against these rules gives:
#
#     distance   squares left   legal seats
#           30              0             0
#           20            161             0
#           15          1,509             6
#           12          4,793           141
#           10          9,587           500
#            8         17,703         1,393
#            5         34,908         5,037
#
# Ten leaves 500 seats on the continent -- scarce enough that siting a realm is
# a real decision, common enough that one can be found. Raise these and the
# count falls away very fast; the drop from 10 to 15 costs 99% of the sites.
kingdom.min.hometown.distance = 10
kingdom.min.entrance.distance = 10
