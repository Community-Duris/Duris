# Hardcore character policy and balance settings.
#
# This file is read once when the server boots. Restart the server after making
# changes. Values are deliberately grouped by the player-facing behavior they
# control. Use true or false for on/off settings.
#
# IMPORTANT: hardcore.levels.beyond.cap is NOT in this file. The Hardcore
# experience-cap lead is configured in lib/frag_cap.cfg so there is one owner
# for all frag-cap rules.

# -----------------------------------------------------------------------------
# Character creation
# -----------------------------------------------------------------------------
# creation.enabled: allow players to create new Hardcore characters. Setting
# this to false still allows ordinary (non-Hardcore) character creation; it
# only removes the Hardcore option.
creation.enabled=true

# creation.veterans.only: when true, newly created Hardcore characters cannot
# also be marked as NEWBIE. Existing characters are not affected.
creation.veterans.only=true

# -----------------------------------------------------------------------------
# Death and permanent-deletion policy
# -----------------------------------------------------------------------------
# death.max.count: number of counted deaths a Hardcore character may have.
# The current product decision is 1: the first counted death is final when
# death.permadeath is true. Valid range: 1-100.
death.max.count=1

# death.count.arena.deaths: count deaths that happen inside an arena toward
# death.max.count. false preserves the normal behavior: arena deaths do not
# consume a Hardcore life.
death.count.arena.deaths=false

# death.permadeath: when true, remove a Hardcore character permanently when
# the configured death limit is reached. When false, the character follows the
# ordinary post-death path instead of being deleted.
death.permadeath=true

# death.record.killer: save the killer name with the character's death record
# for later Hall-of-Fame display. This does not change combat damage or death
# counting.
death.record.killer=true

# death.hall.of.fame: include Hardcore characters in Hall-of-Fame updates and
# records. This controls both final-death recording and periodic silent saves.
death.hall.of.fame=true

# death.messages.enabled: show the special Hardcore death/permadeath messages.
# Setting false suppresses those messages but does not disable death counting,
# deletion, killer recording, or Hall-of-Fame updates.
death.messages.enabled=true

# -----------------------------------------------------------------------------
# Level progression and level loss
# -----------------------------------------------------------------------------
# level.exp.bypass.property.cap: when true, Hardcore characters bypass the
# ordinary exp.maxExpLevel property cap and use the racewar/frag cap instead.
# This does not let anyone exceed the shared maximum level of 56.
level.exp.bypass.property.cap=true

# level.loss.protected.at: Hardcore characters at this level or higher are
# protected from level loss. Example: 50 means level 49 may lose a level, while
# level 50 and above may not. Valid range: 1-56.
level.loss.protected.at=50

# -----------------------------------------------------------------------------
# Hardcore combat and equipment bonuses
# -----------------------------------------------------------------------------
# bonus.hp.per.level: extra maximum hit points granted per character level.
# Example: 2 gives a level-40 Hardcore character 80 additional hit points.
# Valid range: 0-100.
bonus.hp.per.level=2

# Healing multiplier applied when a Hardcore character is the healer.
# 1.20 means 120% of the normal healing amount; 1.00 means no Hardcore
# healing bonus; 0.00 disables healing from that Hardcore bonus.
bonus.healing.multiplier=1.20

# Damage multiplier applied to damage dealt by a Hardcore attacker.
# 1.09 means 9% more outgoing damage; 1.00 means no bonus.
bonus.damage.outgoing.multiplier=1.09

# Damage multiplier applied to damage received by a Hardcore victim.
# 0.91 means the Hardcore character receives 91% of normal damage (9% less);
# 1.00 means no incoming-damage protection.
bonus.damage.incoming.multiplier=0.91

# Base amount used by the mass-heal spell when its target is Hardcore.
# The spell adds its normal level-based random component afterward. 100 is the
# ordinary base; 110 preserves the current Hardcore bonus.
bonus.mass.heal.base=110

# Multiplier applied to Hardcore skill-notch improvement rolls.
# 1.60 means 160% of the normal roll; 1.00 means no Hardcore skill bonus.
bonus.skill.notch.multiplier=1.60

# Random-equipment drop multiplier for Hardcore characters.
# 1.50 means 150% of the normal Hardcore-eligible drop chance; 1.00 means no
# Hardcore drop bonus. This is separate from the general random-equipment
# settings in lib/random_equipment.cfg.
bonus.random.equipment.multiplier=1.50

# -----------------------------------------------------------------------------
# Hardcore score and Hall-of-Fame tuning
# -----------------------------------------------------------------------------
# score.level.points: points awarded per character level.
score.level.points=1000

# score.experience.divisor: experience is divided by this number before being
# converted into score points. A smaller divisor gives experience more weight.
score.experience.divisor=10000

# score.frag.points: points awarded per valid frag. This also scales ship-frag
# contributions in the general leaderboard calculation.
score.frag.points=100

# score.multiclass.multiplier: multiply the calculated Hardcore score for a
# multiclass character. 2 means double score; 1 means no multiplier.
score.multiclass.multiplier=2

# score.killer.bonus: extra Hall-of-Fame points recorded when a Hardcore death
# has a named killer. It does not affect the ordinary leaderboard score.
score.killer.bonus=100

# score.death.penalty.points: points subtracted per recorded death in the
# leaderboard score. Set to 0 to remove the death penalty from scoring.
score.death.penalty.points=25

# score.invalid.frag.threshold: frags at or above this value are treated as
# corrupted/invalid and excluded from score calculations. This is a safety
# filter, not a cap on legitimate gameplay frags.
score.invalid.frag.threshold=100000

# score.display.divisor: divide stored score points by this number for display.
# It changes presentation only, not the underlying score. 100 preserves the
# current two-decimal score display scale.
score.display.divisor=100

# -----------------------------------------------------------------------------
# Special game modes
# -----------------------------------------------------------------------------
# In these modes, true removes the Hardcore flag when the character enters the
# mode. The compile-time mode must also be enabled for the setting to matter.
mode.disable.in.ctf=true
mode.disable.in.chaos=true
