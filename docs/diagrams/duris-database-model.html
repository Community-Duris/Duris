      min-height: 100vh;

      color: var(--ink);
      font-family: var(--sans);

    main { width: min(1280px, 100%); margin: 0 auto; overflow-x: auto; }

      color: var(--muted);
      font: 500 0.66rem/1 var(--mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 24px; font: 400 2rem/1.15 var(--serif); }
    svg { display: block; width: 100%; min-width: 960px; }
  </style>
